{% extends "base.html" %}

{% block title %}Welcome | Howard’s Billiards Place{% endblock %}

{% block content %}
<section class="hero-panel">
    <p class="page-kicker mb-3">Play. Gather. Enjoy.</p>
    <h1 class="display-4">Your next great night starts here.</h1>
    <p class="lead">Reserve a billiards table or karaoke booth at Howard’s Billiards Place.</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center mt-4">
        <a class="btn btn-primary btn-lg" href="{{ url_for('auth.register') }}">Create an account</a>
        <a class="btn btn-outline-primary btn-lg" href="{{ url_for('auth.login') }}">Log in</a>
    </div>
</section>
{% endblock %}
