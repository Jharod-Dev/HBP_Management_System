{% extends "base.html" %}

{% block title %}Log in | Howard’s Billiards Place{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="page-heading"><div><p class="eyebrow text-uppercase text-muted small fw-bold mb-2">Welcome back</p><h1>Log in</h1></div></div>
        <form method="post" class="card card-body">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" name="email"
                       value="{{ form.get('email', '') }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" required>
            </div>
            <button class="btn btn-primary" type="submit">Log in</button>
        </form>
        <p class="mt-3 text-center">Need an account? <a href="{{ url_for('auth.register') }}">Register</a>.</p>
    </div>
</div>
{% endblock %}
